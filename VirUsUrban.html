<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ticket Vir~Us Urban</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 3. TODO EN NEGRITAS (Global) */
    body, input, select, textarea, button, .form-control {
      font-weight: bold !important;
      color: #000 !important; /* Negro puro para impresión */
    }

    /* RESET BÁSICO */
    body {
      background-color: #ffffff;
      font-family: "Roboto", sans-serif;
      margin: 0;
      padding: 0;
    }

    /* CONTENEDOR PRINCIPAL */
    .ticket-wrapper {
      width: 100%;
      min-height: 100vh;
      padding: 0;
      display: block;
    }

    /* CUERPO DEL TICKET */
    .ticket {
      background-color: #ffffff;
      width: 100%;
      max-width: 100%;
      border: none;
      padding: 1rem;
    }

    /* FECHA Y HORA */
    .date-time {
      text-align: left;
      font-family: "Roboto", monospace;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    /* NOMBRE DE MARCA */
    .brand-name {
      font-family: "UnifrakturCook", system-ui;
      text-align: center;
      font-size: 4rem; 
      line-height: 1;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    /* 2. ESTILOS DE TABLA SIN BORDES */
    .ticket-table, 
    .ticket-table * {
      border: none !important; /* Elimina todos los bordes */
      border-color: transparent !important;
    }
    .ticket-table {
      width: 100%;
    }

    .ticket-table th,
    .ticket-table td {
      padding: 0.5rem;
      vertical-align: middle;
      /* Eliminé el border: 2px solid... */
    }
    
    /* INPUTS */
    .ticket-table input {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
      padding: 0;
      font-size: 1.1rem;
    }
    
    /* 1. CENTRAR CANTIDAD */
    .quantity-input {
      text-align: center;
    }

    .price-input {
      text-align: right;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* TEXTOS FINALES */
    .ticket-message {
      text-align: center;
      margin-top: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .festive-text {
      font-family: "Mountains of Christmas", cursive;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    #grand-total {
        font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="ticket-wrapper">
    <div class="ticket">
      
      <div id="date-time" class="date-time"></div>

      <div class="text-center">
        <h1 class="brand-name" id="trigger-add-row">
          Vir~Us Urban
        </h1>
      </div>

      <script>
        document.getElementById("trigger-add-row").addEventListener("click", function() {
          document.getElementById("add-row").click();
        });
      </script>

      <div class="table-responsive">
        <table class="table ticket-table mb-2">
          <thead>
            <tr>
              <th style="width: 80%;">PRODUCTO</th>
              <th style="width: 5%; text-align: center;">CANTIDAD</th>
              <th style="width: 15%; text-align: right;">PRECIO</th>
            </tr>
          </thead>
          <tbody id="items-body">
            </tbody>
          <tfoot>
            <tr>
              <th colspan="2" class="text-end" style="padding-right: 1rem; font-size: 1.2rem;">TOTAL</th>
              <th class="text-end">
                <span id="grand-total">$0.00</span>
              </th>
            </tr>
          </tfoot>
        </table>
      </div>

      <button type="button" id="add-row" class="d-none">Agregar</button>

      <p class="ticket-message mb-0">
        Les deseamos felices fiestas
      </p>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ----------------------------------------------------
       FECHA Y HORA
       ---------------------------------------------------- */
    function updateDateTime() {
        const now = new Date();
        const options = { 
            year: 'numeric', month: '2-digit', day: '2-digit', 
            hour: 'numeric', minute: '2-digit', hour12: true 
        };
        document.getElementById('date-time').textContent = now.toLocaleString('es-MX', options).replace(',', '');
    }
    updateDateTime();
    setInterval(updateDateTime, 60000);

    /* ----------------------------------------------------
       LÓGICA DE TABLA
       ---------------------------------------------------- */
    (function () {
      const tbody = document.getElementById("items-body");
      const addRowBtn = document.getElementById("add-row");
      const grandTotalEl = document.getElementById("grand-total");

      const moneyFormatter = new Intl.NumberFormat('es-MX', {
        style: 'currency', currency: 'MXN', minimumFractionDigits: 2
      });

      function parseCurrency(str) {
        if (!str) return 0;
        const cleanStr = str.toString().replace(/[^0-9.]/g, ''); 
        return parseFloat(cleanStr) || 0;
      }

      function createRow() {
        const tr = document.createElement("tr");
        // 1. CANTIDAD POR DEFECTO EN 1 (value="1")
        tr.innerHTML = `
          <td>
            <input type="text" class="product-input" placeholder="Producto">
          </td>
          <td>
            <input type="number" class="quantity-input" min="0" step="1" value="1">
          </td>
          <td>
            <input type="text" class="price-input" inputmode="decimal" placeholder="$0.00">
          </td>
        `;
        tbody.appendChild(tr);
        attachRowListeners(tr);
        updateTotals(); // Actualizar para que tome el "1" en cuenta (aunque precio sea 0)
      }

      function attachRowListeners(row) {
        const qtyInput = row.querySelector(".quantity-input");
        const priceInput = row.querySelector(".price-input");

        // Eventos de formato de precio
        priceInput.addEventListener("focus", (e) => {
            const val = parseCurrency(e.target.value);
            if (val !== 0 || e.target.value !== "") {
                e.target.value = val; 
            } else {
                e.target.value = "";
            }
        });

        priceInput.addEventListener("blur", (e) => {
            const val = parseCurrency(e.target.value);
            if (val !== 0) {
                e.target.value = moneyFormatter.format(val);
            } else {
                e.target.value = ""; 
            }
            updateTotals();
        });

        [qtyInput, priceInput].forEach((input) => {
          input.addEventListener("input", updateTotals);
        });
      }

      function updateTotals() {
        let grandTotal = 0;

        tbody.querySelectorAll("tr").forEach((row) => {
          // Leer valor, si está vacío asumir 0
          const qtyVal = row.querySelector(".quantity-input").value;
          const qty = parseFloat(qtyVal) || 0;
          
          const priceStr = row.querySelector(".price-input").value;
          const price = parseCurrency(priceStr);
          
          grandTotal += (qty * price);
        });

        grandTotalEl.textContent = moneyFormatter.format(grandTotal);
      }

      createRow();
      addRowBtn.addEventListener("click", createRow);
    })();
  </script>
</body>
</html>
