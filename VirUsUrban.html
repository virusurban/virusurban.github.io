<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ticket Vir~Us Urban</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- BOOTSTRAP 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fuente tipo chicana (gótica) -->
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
.total-amount::before {
  content: "$";
  margin-right: 3px;
}

.total-title {
  font-weight: bold;
}


/* Quitar bordes de toda la tabla */
.ticket-table, 
.ticket-table * {
  border: none !important;
}

/* Quitar líneas que Bootstrap agrega */
.ticket-table {
  --bs-table-border-color: transparent !important;
  border-color: transparent !important;
}







    body {
      background-color: #ffffff;
      font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .ticket-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .ticket {
      background-color: #ffffff;
      border: 2px solid #000;
      max-width: 480px;
      width: 100%;
      padding: 2rem 1.5rem 1.75rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    /* Logo redondo arriba */
    .ticket-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
    
      margin: 0 auto 0.75rem;
      border: 3px solid #000;
    }

    .ticket-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Nombre en letra chicana */
    .brand-name {
      font-family: "UnifrakturCook", system-ui;
      text-align: center;
      font-size: 2rem;
      letter-spacing: 0.05em;
      text-transform: capitalize;
      margin-bottom: 1.5rem;
    }

    /* Tabla tipo ticket */
    .ticket-table th,
    .ticket-table td {
      font-family: "Rubik Spray Paint", cursive;
      border: 2px solid #000;
      padding: 0.4rem 0.5rem;
      vertical-align: middle;
    }

    .ticket-table input {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
      padding: 0;
      font-size: 0.95rem;
    }

    .ticket-table input::-webkit-outer-spin-button,
    .ticket-table input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .ticket-table input[type="number"] {
      -moz-appearance: textfield;
      text-align: right;
    }

    tfoot th {
      background: #ffffff;
    }

    .btn-add-row {
      font-size: 0.9rem;
      padding: 0.25rem 0.9rem;
    }

    .ticket-message {
      text-align: center;
      font-weight: 700;
      margin-top: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Prefijo de moneda para la columna de precio y total */

  </style>
</head>
<body>
  <div class="ticket-wrapper">
    <div class="ticket">
      <!-- Logo superior -->
      <div class="ticket-log">
        <h1 class="brand-name" id="trigger-add-row" style="font-size: 5rem; line-height: 1; cursor:pointer;">
          V~U
        </h1>
        <script>
          // Cuando se haga clic en el h1, activar botón "Agregar"
          document.getElementById("trigger-add-row").addEventListener("click", function() {
            document.getElementById("add-row").click();
          });
        </script>
                
      </div>

      <!-- Nombre de la marca -->
       <!--<h1 class="brand-name">Vir~Us Urban</h1>-->

      <!-- Tabla de productos -->


      






      <div class="table-responsive">
        <table class="table ticket-table mb-2">
          <thead>
            <tr>
              <th style="width: 50%;">Producto</th>
              <th style="width: 10%;">Cantidad</th>
              <th style="width: 30%;">Precio</th>
            </tr>
          </thead>
          <tbody id="items-body">
            <!-- Fila inicial -->
            <tr>
              <td>
                <input type="text"
                       class="form-control form-control-sm border-0 shadow-none product-input"
                       placeholder="Producto">
              </td>
              <td>
                <input type="number"
                       class="form-control form-control-sm border-0 shadow-none quantity-input"
                       min="0" step="1"
                       placeholder="0">
              </td>
              <td class="currency-prefix">
                <input type="number"
                       class="form-control form-control-sm border-0 shadow-none price-input"
                       min="0" step="0.01"
                       placeholder="0.00">
              </td>
            </tr>
          </tbody>
          <tfoot>
            <!-- Fila TOTAL (suma de cantidad * precio) -->
            <tr>
              <th colspan="2" class="text-end">TOTAL</th>
              <th class="currency-prefix">
                <span id="grand-total">0.00</span>
              </th>
            </tr>
          </tfoot>
        </table>
      </div>
      <!-- Botón agregar fila -->
      <button type="button" id="add-row" class="btn btn-outline-dark btn-add-row d-none">
        Agregar
      </button>
      

      <!-- Mensaje final -->
      <p class="ticket-message mb-0 festive-text">
        Vir~Us Urban les desea felices fiestas
      </p>
      
      <style>
        .festive-text {
          font-family: "Mountains of Christmas", cursive;
          font-size: 1  rem;      /* Ajusta el tamaño */
          letter-spacing: 2px;    /* Más festivo */
          color: #000;         /* Rojo navideño opcional */
        }
      </style>
      
    </div>
  </div>

  <!-- JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lógica para agregar filas y calcular total -->
  <script>
    (function () {
      const tbody = document.getElementById("items-body");
      const addRowBtn = document.getElementById("add-row");
      const grandTotalEl = document.getElementById("grand-total");

      // Crea una nueva fila en la tabla
      function createRow() {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            <input type="text"
                   class="form-control form-control-sm border-0 shadow-none product-input"
                   placeholder="Producto">
          </td>
          <td>
            <input type="number"
                   class="form-control form-control-sm border-0 shadow-none quantity-input"
                   min="0" step="1"
                   placeholder="0">
          </td>
          <td class="currency-prefix">
            <input type="number"
                   class="form-control form-control-sm border-0 shadow-none price-input"
                   min="0" step="0.01"
                   placeholder="0.00">
          </td>
        `;
        tbody.appendChild(tr);
        attachRowListeners(tr);
      }

      // Asigna eventos a una fila para recalcular cuando se cambien los valores
      function attachRowListeners(row) {
        const qtyInput = row.querySelector(".quantity-input");
        const priceInput = row.querySelector(".price-input");

        [qtyInput, priceInput].forEach((input) => {
          input.addEventListener("input", updateTotals);
        });
      }

      // Calcula la suma total (cantidad * precio) de todas las filas
      function updateTotals() {
        let grandTotal = 0;

        tbody.querySelectorAll("tr").forEach((row) => {
          const qty = parseFloat(row.querySelector(".quantity-input").value) || 0;
          const price = parseFloat(row.querySelector(".price-input").value) || 0;
          const subtotal = qty * price;
          grandTotal += subtotal;
        });

        grandTotalEl.textContent = grandTotal.toFixed(2);
      }

      // Listeners iniciales
      tbody.querySelectorAll("tr").forEach(attachRowListeners);
      addRowBtn.addEventListener("click", createRow);
    })();
  </script>
</body>
</html>
